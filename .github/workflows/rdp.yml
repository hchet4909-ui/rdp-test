name: secure-rdp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 1
        net user RDP MR.English200 /add
        net localgroup administrators RDP /add

    - name: Download & Install Tailscale
      run: |
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-unsigned.msi" -OutFile "tailscale-setup.msi"
        Start-Process msiexec.exe -ArgumentList '/i tailscale-setup.msi /quiet /norestart' -Wait

    - name: Connect to Tailscale
      run: |
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="${{ secrets.TS_AUTHKEY }}" --accept-routes

    - name: Get Tailscale IP
      run: |
        Write-Host "--- RDP ACCESS ---"
        $TS_IP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "Address: $TS_IP"
        Write-Host "Username: RDP"
        Write-Host "Password: MR.English200"

    - name: Keep Alive
      run: |
        while ($true) {
          Start-Sleep -Seconds 30
          Write-Host "Waiting for RDP profile to be created..."
        }
